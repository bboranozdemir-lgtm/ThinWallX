[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sectalix"
version = "1.0.1"
description = "Numerical analysis tool for arbitrary thin-walled structural sections"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Berke Boran Özdemir" }]
keywords = ["structural-engineering", "thin-walled", "cross-section", "torsion", "warping", "shear-flow", "shear-center", "section-properties"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
]

[project.scripts]
sectalix = "sectalix.cli:main"

[project.urls]
Homepage = "https://github.com/bboranozdemir-lgtm/Sectalix"
Documentation = "https://github.com/bboranozdemir-lgtm/Sectalix#readme"
Repository = "https://github.com/bboranozdemir-lgtm/Sectalix"
Issues = "https://github.com/bboranozdemir-lgtm/Sectalix/issues"
Changelog = "https://github.com/bboranozdemir-lgtm/Sectalix/releases"

[project.optional-dependencies]
plots = [
    "matplotlib>=3.6",
]
test = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/sectalix/docs" = ["docs/THEORY_AND_CONVENTIONS.md", "docs/CLI_REFERENCE.md", "docs/VERIFICATION_BENCHMARKS.md", "docs/V0_8_USAGE.md"]
"share/sectalix/schemas" = ["schemas/sectalix-0.8.schema.json"]
