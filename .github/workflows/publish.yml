name: Release artifacts

on:
  push:
    tags: ["v1.0.1"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install release tools
        run: python -m pip install build twine
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, tomllib; from pathlib import Path;
          v=tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          assert os.environ['RELEASE_TAG']=='v'+v, 'Tag/package version mismatch'"
      - name: Build fresh distributions
        run: python -m build --outdir release-dist
      - name: Validate package metadata
        run: python -m twine check --strict release-dist/*
      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sectalix-${{ github.ref_name }}-distributions
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: github.ref == 'refs/tags/v1.0.1'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sectalix
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v6
        with:
          name: sectalix-${{ github.ref_name }}-distributions
          path: release-dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-dist
