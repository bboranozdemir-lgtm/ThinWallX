name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: write

jobs:
  cleanup_source_docs:
    if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/public-academic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/public-academic
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Clean obsolete internal source wording
        shell: python
        run: |
          from pathlib import Path
          import re

          replacements = {
              "src/sectalix/stress.py": [
                  ('"""v0.7 stress recovery, following ACTIVE_PHASE.md §§2–3.',
                   '"""Linear-elastic stress recovery for supported thin-wall section models.'),
              ],
              "src/sectalix/serialization.py": [
                  ('"""Strict, lossless v0.8 document codec. See ACTIVE_PHASE_v0.8.md §2.',
                   '"""Strict v0.8 document codec with lossless float64 representation.'),
              ],
              "src/sectalix/plotting.py": [
                  ('"""Headless deterministic technical plots; mechanics remain in frozen evaluators.',
                   '"""Headless technical plotting for Sectalix analysis results.'),
              ],
              "src/sectalix/torsion.py": [
                  ('"""Exact open-section Saint-Venant torsion and warping analysis (Sectalix v0.4).',
                   '"""Open-section thin-wall Saint-Venant torsion and warping analysis.'),
                  ('Governing Equations & Conventions (ACTIVE_PHASE.md):',
                   'Governing equations and conventions:'),
                  ('Exact propagation from arbitrary root node:',
                   'Propagation from a selected root node:'),
                  ('"""Exact warping properties along a single straight centerline segment.',
                   '"""Warping quantities along a single straight centerline segment.'),
                  ('"""Exact integral of normalized sectorial coordinate over the section:',
                   '"""Closed-form integral of normalized sectorial coordinate over the section:'),
                  ('Governing Mathematical Formulation (ACTIVE_PHASE.md):',
                   'Governing mathematical formulation:'),
                  ('Obtain accepted v0.3 shear-center location',
                   'Obtain the shear-center location'),
                  ('8. Exact warping constant:',
                   '8. Closed-form straight-segment warping integral:'),
                  ('# 2. Accepted v0.3 shear center pole', '# 2. Shear-center pole'),
              ],
              "src/sectalix/shear_flow.py": [
                  ('"""Exact thin-walled shear-flow analysis for open sections (Sectalix v0.2).',
                   '"""Thin-wall shear-flow analysis for open sections.'),
              ],
              "src/sectalix/closed_shear_flow.py": [
                  ('"""Closed-section transverse shear-flow analysis (Sectalix v0.5).',
                   '"""Closed-section transverse shear-flow analysis.'),
                  ('Implements the exact thin-walled closed-section formulation:',
                   'Implements the documented thin-wall closed-section formulation:'),
                  ('via accepted v0.2 open-tree mechanics.',
                   'via the open-tree shear-flow solver.'),
              ],
              "src/sectalix/closed_torsion.py": [
                  ('"""Closed-section Bredt-Batho Saint-Venant torsion and warping mechanics (Sectalix v0.5).',
                   '"""Closed-section Bredt-Batho torsion and warping mechanics.'),
              ],
              "src/sectalix/cells.py": [
                  ('"""Planar cell topology extraction for closed thin-walled sections (Sectalix v0.5).',
                   '"""Planar cell topology extraction for closed thin-walled sections.'),
              ],
              "src/sectalix/mixed_topology.py": [
                  ('"""Planar graph decomposition and topology extraction for mixed open-closed sections (Sectalix v0.6).',
                   '"""Planar graph decomposition and topology extraction for mixed open-closed sections.'),
              ],
              "src/sectalix/mixed_shear_flow.py": [
                  ('"""Mixed open-closed transverse shear-flow analysis (Sectalix v0.6).',
                   '"""Mixed open-closed transverse shear-flow analysis.'),
                  ('Implements the exact thin-walled mixed open-closed formulation:',
                   'Implements the documented thin-wall mixed open-closed formulation:'),
                  ('via accepted open-tree mechanics', 'via the open-tree shear-flow solver'),
              ],
              "src/sectalix/mixed_torsion.py": [
                  ('"""Mixed open-closed Saint-Venant torsion and warping mechanics (Sectalix v0.6).',
                   '"""Mixed open-closed Saint-Venant torsion and warping mechanics.'),
              ],
              "src/sectalix/mixed_section.py": [
                  ('"""MixedSection class representing mixed open-closed thin-walled cross sections (Sectalix v0.6)."""',
                   '"""MixedSection for mixed open-closed thin-walled cross-sections."""'),
              ],
              "src/sectalix/validation.py": [
                  ('"""Input and topology validation for Sectalix v0.1."""',
                   '"""Input geometry and topology validation for Sectalix sections."""'),
              ],
              "src/sectalix/dxf.py": [
                  ('"""Restricted ASCII DXF centerlines (AC1009/AC1015), v0.8 §3.',
                   '"""Restricted ASCII DXF centerline import for AC1009/AC1015 files.'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          forbidden = (
              "ACTIVE_PHASE",
              "accepted v0.3",
              "accepted v0.2",
              "accepted open-tree mechanics",
              "frozen evaluators",
              "frozen APIs",
          )
          offenders = []
          for path in Path("src/sectalix").glob("*.py"):
              text = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      offenders.append(f"{path}: {marker}")
          if offenders:
              raise SystemExit("Remaining obsolete source markers:\n" + "\n".join(offenders))
      - name: Restore normal CI and remove temporary workflow
        run: |
          git rm -f .github/workflows/public-cleanup.yml
          git checkout HEAD^ -- .github/workflows/ci.yml
      - name: Commit source-documentation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/sectalix
          git commit -m "Clean remaining source documentation markers"
          git push origin HEAD:cleanup/public-academic

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[test,plots]"
      - name: Install packaging test tools
        run: python -m pip install "setuptools>=77.0.3" wheel
      - name: Run test suite
        run: python -m pytest -W error
