name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[test,plots]"
      - name: Install backend used by frozen packaging tests
        run: python -m pip install "setuptools>=70" wheel
      - name: Frozen regression suite
        run: >-
          python -c "
          import subprocess, sys, os
          proc = subprocess.run([sys.executable, '-m', 'pytest', '-W', 'error', '--tb=short', '-v'], capture_output=True, text=True)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary and proc.returncode != 0:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('## Pytest Failure Output on ' + sys.platform + ' (Python ' + sys.version.split()[0] + ')\n\n```\n' + proc.stdout[-6000:] + '\n' + proc.stderr[-6000:] + '\n```\n')
          print(proc.stdout)
          print(proc.stderr, file=sys.stderr)
          sys.exit(proc.returncode)
          "
